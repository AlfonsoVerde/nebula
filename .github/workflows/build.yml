name: Build Nebula.dmg
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle MarkItDown (standalone, no Python needed on the Mac)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install "markitdown[pdf,docx,pptx,xlsx,xls]" pyinstaller
          printf 'from markitdown.__main__ import main\nmain()\n' > mid_entry.py
          pyinstaller --noconfirm --onedir --name markitdown \
            --collect-all markitdown --collect-all magika --collect-data pdfminer mid_entry.py
          ./dist/markitdown/markitdown --help | head -3
          mkdir -p Resources/markitdown
          cp -R dist/markitdown/. Resources/markitdown/
          du -sh Resources/markitdown
      - name: Build app (universal)
        run: UNIVERSAL=1 ./build.sh
      - name: Check translations
        run: plutil -lint build/Nebula.app/Contents/Resources/*.lproj/*.strings
      - name: Make DMG
        run: |
          mkdir -p dmg
          cp -R build/Nebula.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Nebula" -srcfolder dmg -ov -format UDZO build/Nebula.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-dmg
          path: build/Nebula.dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Nebula.dmg --title "Nebula" --notes "Apri il .dmg e trascina Nebula in Applicazioni." --latest
